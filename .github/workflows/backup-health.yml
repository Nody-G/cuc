name: Santé des sauvegardes (R2)

# Contrôle de fraîcheur, de complétude et de couverture du dispositif de
# sauvegarde (`plans/plan-backups-automatiques-2026.md` § 8, Lot 6).
# La planification a été VOLONTAIREMENT RETIRÉE (décision du propriétaire,
# 2026-10-01) : sans sauvegarde planifiée, il n'y a plus rien à surveiller
# automatiquement. Ce job ne se déclenche donc plus que manuellement. Il ne
# produit ni ne restaure rien : il **constate**, en lecture seule, et échoue
# visiblement quand le dispositif est en panne.
on:
  workflow_dispatch:

# Un seul contrôle à la fois : jamais de chevauchement.
concurrency:
  group: backup-health-cuc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    name: Fraîcheur · complétude · couverture
    # Garde de dépôt : jamais d'exécution sur un fork, où les secrets sont absents.
    if: github.repository == 'Nody-G/cuc'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le CLI sort `0` (sain), `2` (avertissement) ou `1` (critique). Le job
      # échoue sur `1` ; un `2` devient une annotation `::warning::` visible
      # sans faire échouer la CI. Secrets : exactement les mêmes noms que
      # `backup.yml` — aucun secret nouveau n'est introduit ici.
      - name: Contrôle de santé (lecture seule)
        run: |
          set +e
          npx tsx scripts/backup/check_backup_health.ts --max-age-hours=48
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Sauvegardes en état d'avertissement — voir le résumé d'étape."
            exit 0
          fi
          exit "$code"
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
