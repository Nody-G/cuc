name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Annule les exécutions obsolètes lorsqu'un nouveau commit arrive sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Audit (routes, ancres, liens)
        run: npm run audit:strict

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
