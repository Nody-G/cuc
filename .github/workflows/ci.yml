name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Annule les exécutions obsolètes lorsqu'un nouveau commit arrive sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Gate Mode Studio : couverture des champs éditables, budget performance
      # (canal Realtime unique, aperçu allégé, revalidation FR + EN, aucune
      # écriture depuis l'aperçu) et dette de micro-textes mesurée. La dette de
      # micro-textes est **non bloquante** ici (elle est publiée dans le rapport) ;
      # une page sans champ éditable ou un écart de budget, eux, cassent la CI.
      - name: Mode Studio — audits (champs, budget, micro-textes)
        run: npm run studio:gate

      - name: Audit (routes, ancres, liens)
        run: npm run audit:strict

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
